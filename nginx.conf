# Nginx site configuration for the DSP frontend container.

# Files with a content hash in their name (Vite output) never change, so they
# can be cached for a year. Everything else must be revalidated.
map $uri $cache_control {
    default "no-cache";
    "~^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|png|jpe?g|svg|webp|woff2?)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Keep all add_header lines at this level: an add_header inside a location
    # would silently drop every header listed here for that location.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Used by the container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing asset is a real 404, not the application page.
    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths are handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
